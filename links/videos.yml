# Videos and courses on the "Useful links" page (useful-links.qmd).
#
# Single source for that section: `python tools/build_video_links.py` writes links/_videos.md from this file,
# and tests/test_useful_links.py checks both (fields, https, module links, no manufacturer channels, generated
# file up to date). See docs/decisions.md, 2026-11-26.
#
# How items were chosen: for each topic, YouTube was searched with results sorted by view count, and talks from
# societies, universities, hospitals, journals and established educators that match the course were kept.
# Manufacturer channels and short promotional clips were left out. The author's own bookmarks are marked
# `bookmark: true`.
#
# `length` and `views` are copied as YouTube showed them on `checked` (search results and video pages). Views change
# daily, so the page always prints them with that date. Lengths of non-YouTube items come from the item's own page.

checked: 2026-11-26

topics:
  foundations: "Foundations: the heart's electrical system"
  mechanisms: "Arrhythmia mechanisms"
  electrograms: "Electrograms and the EP study"
  mapping: "Mapping methods and mapping systems"
  ablation: "Ablation energy and biophysics"
  ecgi: "ECG imaging and the inverse problem"
  simulation: "Simulation and digital twins"
  experimental: "Optical mapping and lab methods"
  courses: "Courses, reference sites and open tools"
  beyond: "Beyond the heart: the same mapping ideas"

