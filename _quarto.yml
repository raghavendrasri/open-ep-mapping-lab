project:
  type: website
  output-dir: _site
  # Only these files become pages. The module template in templates/ is never rendered.
  render:
    - index.qmd
    - disclaimer.qmd
    - errata.qmd
    - course-map.qmd
    - ai-competencies.qmd
    - useful-links.qmd
    - about.qmd
    - glossary/index.qmd
    - formula-sheet/index.qmd
    - modules/*.qmd
  # Copied to the site as-is: demo scripts (plain ES modules, no build step) and pinned
  # third-party files such as the self-hosted IBM Plex fonts (SIL Open Font License).
  resources:
    - demos/
    - vendor/
    # The Learning Hub is a self-contained page built by tools/build_learning_hub.py; only the built page is
    # published, not its source folder.
    - learning-hub/index.html
    # Site icons and social preview card made from the author's logo by tools/make_favicons.py.
    - favicon.ico
    - apple-touch-icon.png
    - assets/logo/og-card.png
    - robots.txt

# The sidebar is generated from docs/curriculum.md by tools/sync_curriculum.py.
metadata-files:
  - _sidebar.yml

website:
  title: "Open EP Mapping Lab"
  description: "A free, open course on cardiac electroanatomic mapping systems."
  site-url: https://openepengineering.org/
  favicon: favicon.png
  # Link previews when a page is shared (LinkedIn, X, messaging apps); 1200x630 social card.
  image: assets/logo/og-card.png
  open-graph: true
  twitter-card: true
  page-navigation: true
  # Search lives in the navbar as a text box; press "/" (or f, s) to jump to it.
  search:
    location: navbar
    type: textbox
  navbar:
    logo: assets/logo/logo-mark.png
    # The title text sits next to the logo in the same link, so the logo is decorative (empty alt text).
    logo-alt: ""
    # Four main items, the rest under "More". The logo and title link to the home page.
    left:
      - href: course-map.qmd
        text: Course map
      - href: learning-hub/index.html
        text: Learning hub
      - href: useful-links.qmd
        text: Useful links
      - href: about.qmd
        text: About
      - text: More
        menu:
          - href: glossary/index.qmd
            text: Glossary
          - href: formula-sheet/index.qmd
            text: Formula sheet
          - href: ai-competencies.qmd
            text: AI competencies
          - href: modules/m03-electrograms.qmd
            text: Pilot module
          - text: "---"
          - href: errata.qmd
            text: Errata
          - href: disclaimer.qmd
            text: Disclaimer
    right:
      # The author's LinkedIn profile (same address as author.linkedin in _variables.yml).
      - icon: linkedin
        href: https://www.linkedin.com/in/eraghavendrasri/
        aria-label: "The author on LinkedIn"
  page-footer:
    # AI disclosure (docs/decisions.md, 2026-11-27): the link explains how AI drafts are checked.
    left: "Education only. Not for clinical use.<br>[Developed using AI: Claude and Gemini](/about.html#how-the-content-is-written-and-checked)"
    center:
      - icon: linkedin
        href: https://www.linkedin.com/in/eraghavendrasri/
        aria-label: "The author on LinkedIn"
    right: "[Cite this course](/about.html#how-to-cite) · Text CC BY 4.0 · Code MIT"

bibliography: references.bib
link-citations: true

# Every page gets a "Cite this page" box (BibTeX and a formatted reference) and citation meta tags that Zotero and
# Google Scholar read. Group author as chosen by the author (docs/decisions.md, 2026-11-27); CITATION.cff matches.
author:
  - name:
      literal: "Open EP Mapping Lab contributors"
citation:
  type: webpage
  container-title: "Open EP Mapping Lab"
  issued: 2026
google-scholar: true

filters:
  - filters/badges.lua
  - filters/seo-schema.lua

execute:
  freeze: auto

# Interface wording: the hint shown in the empty search box.
language:
  search-text-placeholder: "Search the course"

format:
  html:
    # Light and dark themes; Quarto adds a switch to the navbar. The first visit follows the reader's
    # system setting (respect-user-color-scheme); the switch overrides it and is remembered.
    theme:
      light:
        - cosmo
        - assets/theme.scss
      dark:
        - cosmo
        - assets/theme.scss
        - assets/theme-dark.scss
    respect-user-color-scheme: true
    css: assets/styles.css
    # nav-current.html marks the menu item for the current page; feedback.html adds the Feedback button and
    # form; analytics.html counts page views once a Cloudflare token is set (see the comment in each file).
    include-after-body:
      - assets/nav-current.html
      - assets/feedback.html
      - assets/analytics.html
    canonical-url: true
    toc: true
    html-math-method: mathjax
