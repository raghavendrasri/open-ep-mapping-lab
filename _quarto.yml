project:
  type: website
  output-dir: _site
  # Only these files become pages. The module template in templates/ is never rendered.
  render:
    - index.qmd
    - disclaimer.qmd
    - errata.qmd
    - course-map.qmd
    - ai-competencies.qmd
    - glossary/index.qmd
    - formula-sheet/index.qmd
    - modules/*.qmd
  # Copied to the site as-is: demo scripts (plain ES modules, no build step) and pinned
  # third-party files such as the self-hosted IBM Plex fonts (SIL Open Font License).
  resources:
    - demos/
    - vendor/

# The sidebar is generated from docs/curriculum.md by tools/sync_curriculum.py.
metadata-files:
  - _sidebar.yml

website:
  title: "Open EP Mapping Lab"
  description: "A free, open course on cardiac electroanatomic mapping systems."
  site-url: https://open-ep-mapping-lab.org/
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: course-map.qmd
        text: Course map
      - href: modules/m03-electrograms.qmd
        text: Pilot module
      - href: glossary/index.qmd
        text: Glossary
      - href: formula-sheet/index.qmd
        text: Formula sheet
      - href: ai-competencies.qmd
        text: AI competencies
      - href: errata.qmd
        text: Errata
      - href: disclaimer.qmd
        text: Disclaimer
  page-footer:
    left: "Education only. Not for clinical use."
    right: "Text CC BY 4.0 · Code MIT"

bibliography: references.bib
link-citations: true

filters:
  - filters/badges.lua

execute:
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    css: assets/styles.css
    toc: true
    html-math-method: mathjax
