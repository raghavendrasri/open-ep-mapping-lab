project:
  type: website
  output-dir: _site
  # Only these files become pages. The module template in templates/ is never rendered.
  render:
    - index.qmd
    - disclaimer.qmd
    - errata.qmd
    - course-map.qmd
    - modules/*.qmd
  # Demo scripts are copied to the site as-is (plain ES modules, no build step).
  resources:
    - demos/

# The sidebar is generated from docs/curriculum.md by tools/sync_curriculum.py.
metadata-files:
  - _sidebar.yml

website:
  title: "Open EP Mapping Lab"
  description: "A free, open course on cardiac electroanatomic mapping systems."
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: course-map.qmd
        text: Course map
      - href: modules/m03-electrograms.qmd
        text: Pilot module
      - href: errata.qmd
        text: Errata
      - href: disclaimer.qmd
        text: Disclaimer
  page-footer:
    left: "Education only. Not for clinical use."
    right: "Text CC BY 4.0 · Code MIT"

bibliography: references.bib
link-citations: true

filters:
  - filters/badges.lua

execute:
  freeze: auto

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    html-math-method: mathjax
