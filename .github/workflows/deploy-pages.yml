name: Deploy site to GitHub Pages

# Publishes the site after CI passes on main, so a failing check never goes live.
# Can also be run by hand from the Actions tab.
# Needs: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# Custom domain (openepengineering.org): set under Settings → Pages → Custom domain.
# With an Actions deployment no CNAME file is needed; GitHub ignores one if present.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A CI run triggers a deploy of the commit it checked. When merges land close together, a slow CI run
    # for an older commit can finish last and overwrite the newer site. For workflow_run events,
    # github.sha is the newest commit on main when the event fires, so deploy only when CI checked that
    # commit. Older runs are skipped; the run for the newest commit deploys when its CI passes.
    # A manual run (workflow_dispatch) always builds the newest commit on the chosen branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit that CI checked.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build site
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
