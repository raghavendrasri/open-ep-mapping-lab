name: Deploy site to GitHub Pages

# Publishes the site after CI passes on main, so a failing check never goes live.
# Can also be run by hand from the Actions tab.
# Needs: repo Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit that CI checked.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build site
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
