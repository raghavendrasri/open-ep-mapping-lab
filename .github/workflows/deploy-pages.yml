name: Deploy site to GitHub Pages

# Manual only for now. GitHub Pages on a free plan needs a public repository.
# To turn on publishing once the repo is public:
#   1. Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
#   2. Run this workflow from the Actions tab, or add `push: branches: [main]` below.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
